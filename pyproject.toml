[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent"
version = "0.1.0"
description = "个人自主长篇小说作者智能体"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1"]
production = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "langgraph>=0.2",
]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[tool.setuptools.packages.find]
include = ["novel_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

