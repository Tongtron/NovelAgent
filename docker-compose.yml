services:
  novel-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      NOVEL_AGENT_MODE: offline
      NOVEL_AGENT_DATABASE: /app/data/novel_agent.db
    volumes:
      - novel_data:/app/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["production-infra"]
    environment:
      POSTGRES_DB: novel_agent
      POSTGRES_USER: novel_agent
      POSTGRES_PASSWORD: change-me-before-use
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["production-infra"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    profiles: ["production-infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-before-use
    volumes:
      - minio_data:/data

volumes:
  novel_data:
  postgres_data:
  redis_data:
  minio_data:

